# Dual-V100 daily profile: physical GPUs 0,1 with --layer-split 16 in the model config.
#
# STRATA_SPLIT_RING is the layer split's streamed ring (384 and 512 slots measured no faster
# on a 32K read); STRATA_SPLIT_MTP_BATCH sends the split's draft K/V through the prompt path,
# which can change the drafts and not the target's tokens. STRATA_SM70_CHUNK=0 keeps the
# measured 8,192-token prompt chunk.
[Service]
Environment=STRATA_SPLIT_RING=192
Environment=STRATA_SPLIT_MTP_BATCH=1
Environment=STRATA_SM70_CHUNK=0
