# Measured 2026-11-24 on this pair (UD-IQ3_XXS, split 16, --pipeline-windows 2, 192 greedy tokens,
# 3K and 20K prompts, 15 requests an arm, engine window clock): the K-split hyper-connection read
# cuts the HC down kernels 1.61 -> 1.22 ms a window and the whole window 32.4 -> 31.5 ms
# (ms/token 15.9 -> 15.1). Relative RMS 2e-7 against the plain read, as recorded when it landed.
# FUSED must stay 0: the fused variant's grid-wide spin needs all 160 blocks resident and hangs a
# window when the drafter or the forked shared expert shares the card (verify timeout, layer 17).
[Service]
Environment=STRATA_HC_V100=1
Environment=STRATA_HC_V100_FUSED=0
