# Cap the decode window's expert set (the "Verify window expert cap" entry in
# docs/NVIDIA_V100.md).
#
# The cap keeps token 0's K picks and the best N-K picks of the speculative tail; it drops
# nothing when the tail holds N-K entries or fewer. The daily workload offers short draft
# windows (avg T 1.82-2.01 over three 512-token requests), so with K=10 the tail holds 8-10
# entries and N=20 keeps all of them: 20 does nothing here. N=16 keeps 6 and drops 2-4.
#
# Measured on this service, two drift-paired comparisons of four 32K requests each, 256
# output tokens, the server's default sampling: off 71.5 -> 16 79.7 tok/s (+11.5 %), and
# off 66.2 -> 16 73.9 tok/s (+11.6 %). The two control arms drifted 8 % between them, so
# read this as about +11 % with a wide error bar. A 32K paired run reported +17.7 % at N=20
# and +16.2 % at N=16 at a flat ms/window (2.49 -> 2.81 and 3.24 tokens/window).
#
# The option changes the output: it can accept a draft the exact model would reject.
# STRATA_VERIFY_ECAP=0 restores the exact path.
[Service]
Environment=STRATA_VERIFY_ECAP=16
