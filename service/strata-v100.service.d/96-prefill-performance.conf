# Use the measured V100 prompt performance profile.
# Keep the logical context capacity and INT8 KV format unchanged.
[Service]
Environment=STRATA_PF_WMMA=1
Environment=STRATA_PF_SKIP_UNROUTED=1
Environment=STRATA_KV_GROW=1
Environment=STRATA_CKPT_POOL=1
Environment=STRATA_CKPT_THREADS=1
Environment=STRATA_DEQUANT_WIDE=1
Environment=STRATA_PREFILL_PROMOTE=2048
# Measured on the two-V100 split; both options remain opt-in in the engine.
Environment=STRATA_SPLIT_MTP_BATCH=1
# FP32 tiled QSA scoring: faster long reads, different score summation order.
Environment=STRATA_SELECT_SIMT=1
# Keep hybrid CPU/GPU prefill for small reads; use the streamed walk from 6144 rows.
Environment=STRATA_PREFILL_STREAM_MIN=6144
Environment=STRATA_PREFILL_CPU_SHARE_MAX=6144
# Requires the matching engine: do not price unused ring slots at a rounded boundary.
Environment=STRATA_PREFILL_LOAN_EXACT=1
# PR #94: the first card keeps its own prompt buffers when a loan would cost more, with 256 MiB of
# VRAM left beside them for the lazily loaded vision encoder. Off by default in the engine.
Environment=STRATA_SPLIT_OWN_PRIMARY=1
Environment=STRATA_SPLIT_OWN_HEADROOM_MIB=256
# The direct WMMA plan does not allocate the MMQ-only prompt buffers (Xs/Hh, the dq ring), so the
# expert cache keeps their VRAM. Measured on this rig A-B-A-B against the same profile without it:
# +4.0 % at 8K, +2.2 % at 32K, +1.7 % at 64K, neutral at 2K
# (benchmarks/2026-11-19-v100-prompt-path-decode-budget.md).
Environment=STRATA_PF_WMMA_LEAN=1
# One batch per native CPU layer call (upstream 0.1.63's STRATA_POOL_DEP): no barrier between the
# gate/up and down row phases, a down row range waiting only for its own expert, whose
# intermediate the first worker there quantizes once. Bit-exact (pool_tasks_test compares it with
# the two-phase batch). Measured on this rig, UD-IQ3_XXS, the daily profile env, A-B-A-B with
# bench/run_v100_prefill.py --chain (8,192-token prefix, then 257-2,049-token reads, the daily
# agentic shape): prompt_ms -0.4 % at 257, -1.5 % at 513, -3.9 % at 1,025 and -1.2 % at 2,049
# tokens (pooled -1.76 %, t = 2.7 over 16 pairs); decode unchanged within noise; a read at or above
# the 6,144-row stream floor has no CPU share and is unaffected (docs/NVIDIA_V100.md).
Environment=STRATA_POOL_DEP=1
